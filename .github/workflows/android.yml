# Builds the DJSinatra Android / Android TV / Chromecast APK and publishes it as a GitHub Release.
# Download link (always the newest): https://github.com/ajg1915/DJSinatra/releases/latest/download/DJSinatra.apk
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DJSinatra.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: DJSinatra app v1.0.${{ github.run_number }}
          make_latest: true
          files: DJSinatra.apk
          body: |
            DJSinatra for Android TV, Chromecast with Google TV, Fire TV, phones and tablets.
            Download **DJSinatra.apk** below and install it (see the README for Chromecast steps).
