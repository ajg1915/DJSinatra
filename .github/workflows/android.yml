# Builds the DJSinatra Android / Android TV / Chromecast APK and publishes it as a GitHub Release.
# Download link (always the newest): https://github.com/ajg1915/DJSinatra/releases/latest/download/DJSinatra.apk
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -z "$ANDROID_SIGNING" ]; then
            echo "::error::Missing ANDROID_SIGNING secret. Add it in Settings > Secrets and variables > Actions (see README)."
            exit 1
          fi
          pw="${ANDROID_SIGNING%%:*}"
          echo "::add-mask::$pw"
          printf '%s' "${ANDROID_SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/release.p12"
          alias=$(keytool -list -v -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$pw" \
                  | sed -n 's/^Alias name: //p' | head -n1)
          [ -n "$alias" ] || { echo "::error::Could not read the signing key"; exit 1; }
          echo "Signing with key alias: $alias"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12"
            echo "SIGNING_PASSWORD=$pw"
            echo "SIGNING_ALIAS=$alias"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Check APK signature
        run: |
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/apksigner \
            verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i 'DN:'

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DJSinatra.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: DJSinatra app v1.0.${{ github.run_number }}
          make_latest: true
          files: DJSinatra.apk
          body: |
            DJSinatra for Android TV, Chromecast with Google TV, Fire TV, phones and tablets.
            Download **DJSinatra.apk** below and install it (see the README for Chromecast steps).
