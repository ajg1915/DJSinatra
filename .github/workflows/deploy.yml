# Publishes DJSinatra to GitHub Pages every time you push or upload MP3s.
# It rebuilds tracks.json + playlist.m3u from whatever MP3s are in /tracks.
name: Deploy DJSinatra

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to know when each song was added

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site + track list (MP3 only)
        env:
          # Songs are NOT copied into the website (GitHub Pages sites max out at 1 GB).
          # They stream straight from the repo instead.
          MEDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/tracks
        run: |
          mkdir -p tracks _site
          # the app itself (small): everything except songs, Android code, tools and repo files
          cp index.html app.js style.css sw.js manifest.webmanifest _site/
          cp -r icons _site/
          # when each song was (most recently) added = date of the commit that added it (newest first in git log)
          ADDED="$RUNNER_TEMP/added.tsv"
          git -c core.quotepath=off log --diff-filter=A --format='@%ct' --name-only -- tracks \
            | awk '/^@/ { t = substr($0, 2); next } NF { f = $0; sub(/^tracks\//, "", f); if (!(f in seen)) { seen[f] = 1; print f "\t" t } }' \
            > "$ADDED"
          # tracks.json -> [{ "file": "...", "size": 123, "added": <unix seconds> }]
          find tracks -maxdepth 1 -type f -iname '*.mp3' -printf '%f\t%s\t%T@\n' | sort -f \
            | jq -R -s --rawfile added "$ADDED" '
                ($added | split("\n") | map(select(length > 0) | split("\t") | {key: .[0], value: (.[1] | tonumber)}) | from_entries) as $a
                | split("\n") | map(select(length > 0) | split("\t")
                | {file: .[0], size: (.[1] | tonumber), added: ($a[.[0]] // (.[2] | tonumber | floor))})' \
            > _site/tracks.json
          # playlist.m3u with full URLs so VLC on phones/TVs can stream everything
          {
            echo '#EXTM3U'
            jq -r '.[].file' _site/tracks.json | while IFS= read -r f; do
              echo "#EXTINF:-1,${f%.*}"
              echo "$MEDIA_BASE/$(jq -rn --arg s "$f" '$s|@uri')"
            done
          } > _site/playlist.m3u
          echo "Found $(jq length _site/tracks.json) MP3 files"
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
