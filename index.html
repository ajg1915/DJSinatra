<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DJSinatra</title>
  <meta name="description" content="DJSinatra — instrumental MP3 player for TV, PC, tablet and phone.">
  <meta name="theme-color" content="#0d0b14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DJSinatra">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="44" height="44">
      <div>
        <h1>DJSinatra</h1>
        <p class="tag">Instrumentals · MP3 only</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="btn ghost" hidden>⬇ Install app</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search instrumentals…" aria-label="Search">
      <div class="toolbar-btns">
        <button id="playAllBtn" class="btn primary" title="Play every song in the list, newest first">▶ Play all</button>
        <label class="btn" for="fileInput" tabindex="0" id="uploadLabel">⤒ Upload MP3s</label>
        <input id="fileInput" type="file" accept=".mp3,audio/mpeg" multiple hidden>
        <a id="publishLink" class="btn ghost" target="_blank" rel="noopener" hidden>☁ Publish to GitHub</a>
      </div>
    </section>

    <nav id="cats" class="cats" aria-label="Categories"></nav>

    <div id="dropZone" class="drop" hidden>Drop MP3 files to add them</div>
    <p id="status" class="status" role="status"></p>

    <section>
      <h2 id="libTitle">Library</h2>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>No instrumentals yet. Upload some MP3s to get started.</p>
    </section>
  </main>

  <footer class="player" id="player" hidden>
    <div class="now">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="nowTitle">—</span>
    </div>
    <div class="progress">
      <span id="timeNow">0:00</span>
      <div id="seek" class="seek" aria-hidden="true"><div id="seekFill"></div></div>
      <span id="timeTotal">0:00</span>
    </div>
    <div class="player-btns">
      <button id="prevBtn" class="btn small" aria-label="Previous">⏮</button>
      <button id="playPauseBtn" class="btn small primary" aria-label="Pause">⏸</button>
      <button id="nextBtn" class="btn small" aria-label="Next">⏭</button>
      <button id="stopBtn" class="btn small stop" aria-label="Stop and close the player">■ Stop</button>
    </div>
    <audio id="audio" preload="none"></audio>
  </footer>

  <dialog id="catDialog">
    <form method="dialog">
      <h2 id="catDialogTitle">New category</h2>
      <input id="catName" class="field" type="text" maxlength="40" required placeholder="e.g. Christmas, Ballads, Swing" aria-label="Category name">
      <p class="hint">Categories are saved on this device.</p>
      <div class="dialog-btns">
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="tagDialog">
    <form method="dialog">
      <h2>Categories</h2>
      <p id="tagSong" class="hint"></p>
      <div id="tagList" class="tag-list"></div>
      <div class="new-cat">
        <input id="tagNew" class="field" type="text" maxlength="40" placeholder="New category…" aria-label="New category name">
        <button type="button" id="tagAdd" class="btn">+ Add</button>
      </div>
      <div class="dialog-btns"><button class="btn primary" value="close">Done</button></div>
    </form>
  </dialog>

  <template id="rowTpl">
    <li class="row">
      <button class="play" aria-label="Play"><span class="num"></span><span class="title"></span><span class="meta"></span></button>
      <div class="acts">
        <button class="btn small builtin" title="Play here">▶</button>
        <button class="btn small tagBtn" title="Categories">🏷</button>
        <a class="btn small dl" title="Download MP3" download>⬇</a>
        <button class="btn small del" title="Remove from this device" hidden>✕</button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
