plugins {
    id 'com.android.application'
}

def buildNumber = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'io.github.ajg1915.djsinatra'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ajg1915.djsinatra'
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // Permanent key (from the ANDROID_SIGNING GitHub secret) so in-app updates install over the old app.
        release {
            def store = System.getenv('SIGNING_STORE_FILE')
            if (store) {
                storeFile file(store)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_ALIAS')
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SIGNING_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
